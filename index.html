<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetScope Visuals - Professional Weather Visualization</title>
    <meta name="description" content="Professional weather data visualization with global coverage and multi-model forecasts">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">

    <!-- Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            min-height: 100vh;
            color: #f3f4f6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Controls Panel */
        .controls {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(71, 85, 105, 0.5);
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #60a5fa;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            color: #f3f4f6;
            font-size: 14px;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Checkboxes */
        .variables {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 10px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-label:hover {
            background: rgba(30, 41, 59, 0.8);
        }

        .checkbox-label input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-label span {
            font-size: 13px;
            color: #e5e7eb;
        }

        /* Buttons */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #22d3ee);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        /* Chart Section */
        .chart-section {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(71, 85, 105, 0.5);
        }

        .chart-container {
            position: relative;
            height: 450px;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 12px;
            padding: 20px;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(71, 85, 105, 0.3);
        }

        .stat-card h4 {
            color: #60a5fa;
            font-size: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-label {
            color: #94a3b8;
        }

        .stat-value {
            color: #f3f4f6;
            font-weight: 600;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #60a5fa;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* Messages */
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .message-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }

        .message-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #86efac;
        }

        /* Location results */
        .location-results {
            position: absolute;
            z-index: 1000;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            margin-top: 4px;
        }

        .location-result {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
            transition: background 0.2s;
        }

        .location-result:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .location-result:last-child {
            border-bottom: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        footer a {
            color: #60a5fa;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 MetScope Visuals</h1>
            <p class="subtitle">Professional Weather Data Visualization Platform</p>
        </header>

        <div class="controls">
            <h2 style="margin-bottom: 20px; font-size: 20px;">⚙️ Configuration</h2>

            <div class="control-group">
                <div>
                    <label>📍 Location</label>
                    <div style="position: relative;">
                        <input type="text" id="location-search" placeholder="Search location..." value="London, United Kingdom">
                        <div id="location-results" class="location-results hidden"></div>
                    </div>
                </div>

                <div>
                    <label>📊 Data Type</label>
                    <select id="data-type">
                        <option value="forecast">7-Day Forecast</option>
                        <option value="historical">Historical Archive</option>
                    </select>
                </div>

                <div>
                    <label>🌐 Weather Model</label>
                    <select id="weather-model">
                        <option value="best_match">Best Match (Auto)</option>
                        <option value="ecmwf_ifs025">ECMWF IFS 0.25°</option>
                        <option value="gfs_global">GFS Global</option>
                        <option value="icon_global">ICON Global</option>
                        <option value="meteofrance_arpege_world">MeteoFrance ARPEGE</option>
                        <option value="gem_global">GEM Global</option>
                    </select>
                </div>
            </div>

            <div id="date-controls" class="control-group hidden">
                <div>
                    <label>📅 Start Date</label>
                    <input type="date" id="start-date">
                </div>
                <div>
                    <label>📅 End Date</label>
                    <input type="date" id="end-date">
                </div>
            </div>

            <div>
                <label>📈 Select Weather Variables</label>
                <div class="variables" id="variables"></div>
            </div>

            <div>
                <button class="btn btn-primary" id="fetch-btn">🔄 Visualize Data</button>
                <button class="btn btn-success" id="export-btn">💾 Export CSV</button>
            </div>
        </div>

        <div class="chart-section">
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading weather data...</p>
            </div>

            <div id="message" class="message message-info">
                ℹ️ Select variables and click "Visualize Data" to generate charts
            </div>

            <div class="chart-container">
                <canvas id="weather-chart"></canvas>
            </div>

            <div id="stats" class="stats hidden"></div>
        </div>

        <footer>
            Powered by <a href="https://open-meteo.com/" target="_blank">Open-Meteo API</a> |
            MetScope Visuals 2024
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
